services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - atrium-mongo:/data/db

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  atrium-mongo:
